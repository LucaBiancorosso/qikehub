<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker>
    <style>
      .box{fill:#fff;stroke:#334155;stroke-width:1.4}
      .hub{fill:#f1f5f9;stroke:#0f172a;stroke-width:1.8}
      .sub{fill:#fff;stroke:#64748b;stroke-width:1}
      .mg{fill:#ecfdf5;stroke:#0f766e;stroke-width:1.2}
      .t{fill:#0f172a;font-weight:600}
      .s{fill:#475569;font-size:11.5px}
      .l{stroke:#475569;stroke-width:1.6;fill:none}
      .ln{stroke:#0f766e;stroke-width:1.6;fill:none;stroke-dasharray:5 4}
      .tag{fill:#334155;font-size:11px}
    </style>
  </defs>

  <text x="20" y="30" class="t" font-size="17">qikehub — IKEv2 full-tunnel hub</text>

  <!-- clients -->
  <rect class="box" x="20" y="70" width="200" height="62" rx="8"/>
  <text x="34" y="94" class="t">iPhone / iPad / Mac</text>
  <text x="34" y="114" class="s">native IKEv2 · UDP/500 → 4500</text>
  <rect class="box" x="20" y="150" width="200" height="62" rx="8"/>
  <text x="34" y="174" class="t">Android (strongSwan app)</text>
  <text x="34" y="194" class="s">custom UDP port</text>
  <rect class="box" x="20" y="230" width="200" height="62" rx="8"/>
  <text x="34" y="254" class="t">Linux / macOS swanctl</text>
  <text x="34" y="274" class="s">custom UDP port</text>

  <!-- hub -->
  <rect class="hub" x="330" y="60" width="370" height="440" rx="10"/>
  <text x="346" y="86" class="t" font-size="15">VPS · Debian 13 minimal</text>
  <text x="346" y="104" class="s">nftables: public = UDP/port (+500/4500 hybrid) only</text>

  <rect class="sub" x="350" y="120" width="330" height="92" rx="6"/>
  <text x="364" y="142" class="t">charon (strongSwan 6, swanctl)</text>
  <text x="364" y="162" class="s">ECDSA P-384 certs · AES-256-GCM · SHA-384</text>
  <text x="364" y="180" class="s">ECP-384 + ML-KEM-1024 (RFC 9370) for clients</text>
  <text x="364" y="198" class="s">port_nat_t = custom port · local CRL</text>

  <rect class="sub" x="350" y="228" width="155" height="78" rx="6"/>
  <text x="362" y="250" class="t">xfrm-rw</text>
  <text x="362" y="268" class="s">if_id 10</text>
  <text x="362" y="286" class="s">pool 10.99.0.0/24</text>

  <rect class="sub" x="525" y="228" width="155" height="78" rx="6"/>
  <text x="537" y="250" class="t">xfrm-home</text>
  <text x="537" y="268" class="s">if_id 20</text>
  <text x="537" y="286" class="s">table 220 (egress=home)</text>

  <rect class="mg" x="350" y="322" width="330" height="72" rx="6"/>
  <text x="364" y="344" class="t">mgmt0 10.99.1.1/32 (tunnel-only)</text>
  <text x="364" y="364" class="s">SSH · SNMPv3 authPriv · node_exporter :9100</text>
  <text x="364" y="382" class="s">qikehub_* metrics / NET-SNMP-EXTEND</text>

  <rect class="sub" x="350" y="410" width="330" height="72" rx="6"/>
  <text x="364" y="432" class="t">Egress</text>
  <text x="364" y="452" class="s">vps: masquerade on WAN</text>
  <text x="364" y="470" class="s">home: policy-routed to site, fail-closed</text>

  <!-- internet -->
  <path class="l" d="M220 101 H300 V180 H350" marker-end="url(#a)"/>
  <path class="l" d="M220 181 H350" marker-end="url(#a)"/>
  <path class="l" d="M220 261 H300 V180" />
  <text x="238" y="330" class="tag">IKEv2 / ESP-in-UDP</text>
  <text x="238" y="346" class="tag">cert-only · MOBIKE</text>

  <!-- home -->
  <rect class="box" x="780" y="200" width="200" height="120" rx="8"/>
  <text x="794" y="224" class="t">RB5009 · RouterOS 7</text>
  <text x="794" y="244" class="s">behind CGNAT → initiates</text>
  <text x="794" y="262" class="s">IKEv2 · ECP-384 · AES-GCM</text>
  <text x="794" y="280" class="s">policy: LANs ↔ 10.99.0.0/23</text>
  <text x="794" y="298" class="s">(0.0.0.0/0 if egress=home)</text>
  <path class="l" d="M780 266 H680" marker-end="url(#a)"/>

  <rect class="box" x="780" y="350" width="200" height="62" rx="8"/>
  <text x="794" y="374" class="t">Home LANs</text>
  <text x="794" y="394" class="s">192.168.x.0/24 …</text>
  <path class="l" d="M880 320 V350"/>

  <path class="ln" d="M505 267 H525" marker-end="url(#g)"/>
  <path class="ln" d="M515 306 V322" marker-end="url(#g)"/>
</svg>
